<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/index.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #eeeeee;
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #dcdcdc;
        }

        #stage {
            position: relative;
            display: block;
            flex-shrink: 0;
        }

        #map {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: auto;
        }

        #viewport.dragging {
            cursor: grabbing;
        }

        #viewport:not(.dragging) {
            cursor: crosshair;
        }
    </style>
</head>

<body>

<div id="viewport">
    <div id="stage">
        <svg id="overlay">
            <image id="mapImage"></image>
            <g id="annotations"></g>
            <g id="currentPoints"></g>
        </svg>
    </div>
</div>

<script>
let args = {};
let imageWidth = 1;
let imageHeight = 1;

let zoom = 1.0;
let scrollLeft = 0;
let scrollTop = 0;

let currentPoints = [];
let annotations = [];

let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let dragScrollLeft = 0;
let dragScrollTop = 0;

let moved = false;

const viewport = document.getElementById("viewport");
const stage = document.getElementById("stage");
const overlay = document.getElementById("overlay");
const mapImage = document.getElementById("mapImage");

const annotationLayer = document.getElementById("annotations");
const currentPointLayer = document.getElementById("currentPoints");


/* ---------------------------------------------------------
   Streamlitからデータを受け取る
--------------------------------------------------------- */

function onRender(event) {

    args = event.detail.args || {};

    if (args.image) {
        imageWidth = Number(args.image_width);
        imageHeight = Number(args.image_height);

        mapImage.setAttribute("href", args.image);
        mapImage.setAttribute("x", "0");
        mapImage.setAttribute("y", "0");
        mapImage.setAttribute("width", imageWidth);
        mapImage.setAttribute("height", imageHeight);
    }

    annotations = args.annotations || [];
    currentPoints = args.current_points || [];

    if (args.zoom !== undefined) {
        zoom = Number(args.zoom);
    }

    if (args.scroll_left !== undefined) {
        scrollLeft = Number(args.scroll_left);
    }

    if (args.scroll_top !== undefined) {
        scrollTop = Number(args.scroll_top);
    }

    updateViewer();
    drawAnnotations();
    drawCurrentPoints();
}


/* ---------------------------------------------------------
   ビューア更新
--------------------------------------------------------- */

function updateViewer() {

    const width = imageWidth * zoom;
    const height = imageHeight * zoom;

    stage.style.width = width + "px";
    stage.style.height = height + "px";

    overlay.setAttribute("width", width);
    overlay.setAttribute("height", height);

    overlay.setAttribute(
        "viewBox",
        `0 0 ${imageWidth} ${imageHeight}`
    );

    overlay.style.width = width + "px";
    overlay.style.height = height + "px";

    /*
     * SVGの中に画像を表示
     * viewBoxが元画像座標なので、
     * 座標は常に元画像のpx座標で扱える
     */
    mapImage.setAttribute("width", imageWidth);
    mapImage.setAttribute("height", imageHeight);

    /*
     * 現在位置を復元
     */
    requestAnimationFrame(() => {
        viewport.scrollLeft = scrollLeft;
        viewport.scrollTop = scrollTop;
    });
}


/* ---------------------------------------------------------
   登録済みアノテーションを描画
--------------------------------------------------------- */

function drawAnnotations() {

    annotationLayer.innerHTML = "";

    for (const annotation of annotations) {

        const points = annotation.polyline_px || [];

        if (points.length >= 2) {

            const polyline = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "polyline"
            );

            polyline.setAttribute(
                "points",
                points.map(p => `${p[0]},${p[1]}`).join(" ")
            );

            polyline.setAttribute("fill", "none");
            polyline.setAttribute("stroke", "red");
            polyline.setAttribute("stroke-width", "3");
            polyline.setAttribute("vector-effect", "non-scaling-stroke");

            annotationLayer.appendChild(polyline);
        }

        /*
         * ID表示
         */

        if (points.length > 0) {

            const p = points[0];

            const text = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

            text.setAttribute("x", p[0] + 5);
            text.setAttribute("y", p[1] - 5);

            text.setAttribute("fill", "red");
            text.setAttribute("font-size", "18");
            text.setAttribute("font-weight", "bold");

            text.textContent = annotation.id;

            annotationLayer.appendChild(text);
        }
    }
}


/* ---------------------------------------------------------
   現在入力中の点を描画
--------------------------------------------------------- */

function drawCurrentPoints() {

    currentPointLayer.innerHTML = "";

    currentPoints.forEach((p, index) => {

        const circle = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

        circle.setAttribute("cx", p[0]);
        circle.setAttribute("cy", p[1]);
        circle.setAttribute("r", "5");

        circle.setAttribute("fill", "blue");
        circle.setAttribute("stroke", "white");
        circle.setAttribute("stroke-width", "2");

        circle.setAttribute(
            "vector-effect",
            "non-scaling-stroke"
        );

        currentPointLayer.appendChild(circle);


        /*
         * 点番号
         */

        const text = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

        text.setAttribute("x", p[0] + 7);
        text.setAttribute("y", p[1] - 7);

        text.setAttribute("fill", "blue");
        text.setAttribute("font-size", "14");
        text.setAttribute("font-weight", "bold");

        text.textContent = index + 1;

        currentPointLayer.appendChild(text);
    });


    /*
     * 現在入力中の線
     */

    if (currentPoints.length >= 2) {

        const polyline = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );

        polyline.setAttribute(
            "points",
            currentPoints.map(
                p => `${p[0]},${p[1]}`
            ).join(" ")
        );

        polyline.setAttribute("fill", "none");
        polyline.setAttribute("stroke", "blue");
        polyline.setAttribute("stroke-width", "3");

        polyline.setAttribute(
            "vector-effect",
            "non-scaling-stroke"
        );

        currentPointLayer.insertBefore(
            polyline,
            currentPointLayer.firstChild
        );
    }
}


/* ---------------------------------------------------------
   クリック → 座標取得
--------------------------------------------------------- */

overlay.addEventListener("click", function(event) {

    /*
     * ドラッグ終了直後はクリックとして扱わない
     */
    if (moved) {
        moved = false;
        return;
    }

    const rect = overlay.getBoundingClientRect();

    const x =
        (event.clientX - rect.left)
        / zoom;

    const y =
        (event.clientY - rect.top)
        / zoom;

    const px = Math.round(x);
    const py = Math.round(y);

    currentPoints.push([px, py]);

    drawCurrentPoints();

    sendEvent({
        type: "point",
        x: px,
        y: py,
        current_points: currentPoints,
        zoom: zoom,
        scroll_left: viewport.scrollLeft,
        scroll_top: viewport.scrollTop
    });
});


/* ---------------------------------------------------------
   左ドラッグ → 移動
--------------------------------------------------------- */

overlay.addEventListener("mousedown", function(event) {

    if (event.button !== 0) {
        return;
    }

    dragging = true;
    moved = false;

    dragStartX = event.clientX;
    dragStartY = event.clientY;

    dragScrollLeft = viewport.scrollLeft;
    dragScrollTop = viewport.scrollTop;

    viewport.classList.add("dragging");

    event.preventDefault();
});


window.addEventListener("mousemove", function(event) {

    if (!dragging) {
        return;
    }

    const dx = event.clientX - dragStartX;
    const dy = event.clientY - dragStartY;

    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        moved = true;
    }

    viewport.scrollLeft =
        dragScrollLeft - dx;

    viewport.scrollTop =
        dragScrollTop - dy;
});


window.addEventListener("mouseup", function() {

    if (!dragging) {
        return;
    }

    dragging = false;

    viewport.classList.remove("dragging");

    scrollLeft = viewport.scrollLeft;
    scrollTop = viewport.scrollTop;
});


/* ---------------------------------------------------------
   Ctrl + ホイール → ズーム
--------------------------------------------------------- */

viewport.addEventListener(
    "wheel",
    function(event) {

        if (!event.ctrlKey) {
            /*
             * 通常ホイールはブラウザの
             * スクロールに任せる
             */
            return;
        }

        event.preventDefault();

        const rect =
            viewport.getBoundingClientRect();

        /*
         * マウス位置の「元画像座標」
         */
        const mouseX =
            (
                viewport.scrollLeft
                + event.clientX
                - rect.left
            ) / zoom;

        const mouseY =
            (
                viewport.scrollTop
                + event.clientY
                - rect.top
            ) / zoom;


        /*
         * ズーム倍率
         */

        const factor =
            event.deltaY < 0
                ? 1.15
                : 1 / 1.15;

        const oldZoom = zoom;

        zoom *= factor;

        /*
         * ズーム範囲
         */

        zoom = Math.max(
            0.25,
            Math.min(8.0, zoom)
        );


        /*
         * マウス位置を中心にズーム
         */

        const newScrollLeft =
            mouseX * zoom
            - (event.clientX - rect.left);

        const newScrollTop =
            mouseY * zoom
            - (event.clientY - rect.top);


        updateViewer();

        requestAnimationFrame(() => {

            viewport.scrollLeft =
                Math.max(0, newScrollLeft);

            viewport.scrollTop =
                Math.max(0, newScrollTop);

            scrollLeft =
                viewport.scrollLeft;

            scrollTop =
                viewport.scrollTop;
        });
    },
    { passive: false }
);


/* ---------------------------------------------------------
   ダブルクリック → 100%
--------------------------------------------------------- */

overlay.addEventListener(
    "dblclick",
    function(event) {

        event.preventDefault();

        zoom = 1.0;

        updateViewer();

        requestAnimationFrame(() => {

            viewport.scrollLeft = 0;
            viewport.scrollTop = 0;

            scrollLeft = 0;
            scrollTop = 0;
        });
    }
);


/* ---------------------------------------------------------
   Streamlitへイベント送信
--------------------------------------------------------- */

function sendEvent(data) {

    if (
        typeof Streamlit !== "undefined" &&
        Streamlit.setComponentValue
    ) {
        Streamlit.setComponentValue(data);
    }
}


/* ---------------------------------------------------------
   Streamlitコンポーネント初期化
--------------------------------------------------------- */

if (typeof Streamlit !== "undefined") {

    Streamlit.events.addEventListener(
        Streamlit.RENDER_EVENT,
        onRender
    );

    Streamlit.setComponentReady();

    Streamlit.setFrameHeight(600);
}

</script>

</body>
</html>
